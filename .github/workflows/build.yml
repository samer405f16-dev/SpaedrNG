name: Build SpaedrNG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # هسته Xray (رسمی از XTLS)
      - name: Download Xray core
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a xr
          curl -fL -o xr/x.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -o xr/x.zip -d xr
          cp xr/xray app/src/main/jniLibs/arm64-v8a/libxray.so

      # تونل (hev-socks5-tunnel) با NDK
      - name: Build tunnel library
        run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel
          cd hev-socks5-tunnel
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=$PWD APP_BUILD_SCRIPT=$PWD/Android.mk APP_ABI=arm64-v8a APP_PLATFORM=android-24 NDK_LIBS_OUT=$PWD/libs
          cp libs/arm64-v8a/libhev-socks5-tunnel.so ../app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SpaedrNG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpaedrNG
          path: SpaedrNG.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SpaedrNG build ${{ github.run_number }}
          files: SpaedrNG.apk
